<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mój angielski</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --text:#1d1d1f; --muted:#6b6b70;
    --accent:#2f5d50; --accent-soft:#e3ece8; --border:#e4e1da; --danger:#b3412f; --danger-soft:#f6e3df;
    --good:#2f7a4b; --good-soft:#dff1e5; --warn-soft:#fbf0d9; --warn:#8a5a00;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141517; --card:#1e2023; --text:#ececec; --muted:#9a9ca1;
      --accent:#7fbfa8; --accent-soft:#24332d; --border:#2c2f33; --danger:#e07a68; --danger-soft:#3a2420;
      --good:#7cc79a; --good-soft:#1f3327; --warn-soft:#3a3020; --warn:#e8c27a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  header{margin-bottom:16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:1.5rem;margin:0}
  .db{font-size:.78rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:4px 10px;white-space:nowrap}
  .stats{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--muted);font-size:.9rem}
  .bar{flex:1;height:6px;border-radius:99px;background:var(--border);overflow:hidden}
  .bar > div{height:100%;background:var(--good);width:0;transition:width .3s}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-size:1.05rem;margin:0 0 6px}
  .card p{margin:6px 0;color:var(--muted);font-size:.9rem}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  label:first-child{margin-top:0}
  input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .row{display:flex;gap:8px;align-items:center}
  .row > input{flex:1}
  button{font:inherit;border:none;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--accent-soft);color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);color:var(--card)}
  button.wide{width:100%;margin-top:14px}
  button.small{padding:7px 10px;font-size:.85rem}
  button.ghost{background:transparent;color:var(--muted)}
  button.danger{color:var(--danger);background:transparent}
  button.link{background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:600;font-size:inherit}
  .status{font-size:.84rem;color:var(--muted);margin-top:6px;min-height:1.2em}
  .fix{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.88rem}
  .chips{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
  .chip{padding:7px 12px;border-radius:99px;font-size:.85rem;background:var(--card);border:1px solid var(--border);color:var(--muted)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
  .count{color:var(--muted);font-size:.85rem;margin:0 2px 8px}
  .item{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:14px;padding:14px 14px 10px;margin-bottom:10px}
  .item.known{border-left-color:var(--good)}
  .en{font-size:1.12rem;font-weight:600}
  .pl{margin-top:4px}
  .pron{margin-top:4px;color:var(--accent);font-style:italic}
  .pron::before{content:"[";font-style:normal}
  .pron::after{content:"]";font-style:normal}
  .ex{margin-top:8px;padding:6px 10px;border-left:3px solid var(--accent-soft);font-size:.92rem}
  .ex .exPl{color:var(--muted);margin-top:2px}
  .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .knownBtn.on{background:var(--good-soft);color:var(--good)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .ok{color:var(--good)} .bad{color:var(--danger)}

  .flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
  .flash .front{font-size:1.5rem;font-weight:700;line-height:1.3}
  .flash .hint{color:var(--muted);font-size:.85rem;margin-top:14px}
  .flash .answer{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}
  .flash .answer .big{font-size:1.15rem;font-weight:600}
  .flash .ex{text-align:left;margin-top:12px}
  .progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}
  .answerBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .answerBtns button{padding:14px}
  .no{background:var(--danger-soft);color:var(--danger)}
  .yes{background:var(--good-soft);color:var(--good)}

  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav .in{display:flex;max-width:640px;width:100%}
  nav button{flex:1;background:transparent;border-radius:0;color:var(--muted);padding:10px 4px 12px;font-size:.75rem;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button span{font-size:1.3rem;line-height:1}
  nav button.on{color:var(--accent)}
  .tab{display:none}
  .tab.on{display:block}
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
    padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>Mój angielski</h1><span class="db" id="dbBadge">…</span></div>
    <div class="stats"><span id="statsText"></span><div class="bar"><div id="statsBar"></div></div></div>
  </header>

  <!-- DODAJ -->
  <section class="tab" id="tab-add">
    <div class="card">
      <label for="en">Po angielsku (albo po polsku)</label>
      <div class="row">
        <input id="en" placeholder="wpisz słowo lub zdanie…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="small" id="speakInput" title="Odsłuchaj">🔊</button>
      </div>
      <div class="status" id="autoStatus"></div>
      <div id="fixBox"></div>

      <label for="pl">Tłumaczenie</label>
      <input id="pl" autocomplete="off">

      <label for="pron">Wymowa (po polsku)</label>
      <input id="pron" autocomplete="off">

      <label for="exEn">Przykładowe zdanie</label>
      <input id="exEn" placeholder="po angielsku" autocomplete="off">
      <input id="exPl" placeholder="po polsku" autocomplete="off" style="margin-top:6px">

      <div class="row" style="margin-top:14px">
        <button class="primary" id="save" style="flex:1">Zapisz</button>
        <button id="refill" title="Uzupełnij wszystko od nowa">🔄</button>
      </div>
      <button class="ghost small wide" id="cancel" style="display:none;margin-top:6px">Anuluj edycję</button>
    </div>
  </section>

  <!-- LISTA -->
  <section class="tab" id="tab-list">
    <input id="search" placeholder="Szukaj…" autocomplete="off">
    <div class="chips" id="listFilter">
      <button class="chip on" data-f="all">Wszystkie</button>
      <button class="chip" data-f="todo">Do nauki</button>
      <button class="chip" data-f="known">Znam ✓</button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <!-- NAUKA -->
  <section class="tab" id="tab-learn">
    <div class="chips" id="learnMode">
      <button class="chip on" data-m="todo">Do nauki</button>
      <button class="chip" data-m="all">Wszystkie</button>
      <button class="chip" id="dirBtn" style="margin-left:auto">EN → PL</button>
    </div>
    <div id="learn"></div>
  </section>

  <!-- USTAWIENIA -->
  <section class="tab" id="tab-settings">
    <div class="card">
      <h2>🤖 Gemini (tłumaczenie i poprawki)</h2>
      <p>Klucz z Google AI Studio. Zapisuje się tylko w tej przeglądarce — nie trafia do GitHuba ani do bazy.</p>
      <label for="gKey">Klucz API</label>
      <div class="row">
        <input id="gKey" type="password" placeholder="AIza…" autocomplete="off">
        <button class="small" id="gSave">Zapisz</button>
      </div>
      <div class="status" id="gStatus"></div>
    </div>

    <div class="card">
      <h2>☁️ Baza danych</h2>
      <p id="dbInfo"></p>
      <div id="migrateBox"></div>
    </div>

    <div class="card">
      <h2>💾 Kopia zapasowa</h2>
      <p>Plik .json ze wszystkimi słówkami — na wszelki wypadek albo żeby wczytać nowe.</p>
      <div class="row">
        <button class="small" id="export" style="flex:1">⬇ Pobierz kopię</button>
        <button class="small" id="importBtn" style="flex:1">⬆ Wczytaj plik</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </section>
</div>

<nav><div class="in">
  <button data-tab="add"><span>➕</span>Dodaj</button>
  <button data-tab="list"><span>📚</span>Lista</button>
  <button data-tab="learn"><span>🎯</span>Nauka</button>
  <button data-tab="settings"><span>⚙️</span>Ustawienia</button>
</div></nav>
<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   1) WKLEJ TUTAJ firebaseConfig — ten sam, co w „Progress dietowy”
      (słówka trafią do osobnej kolekcji „slowka”, dieta zostaje nietknięta)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBPPdXhBZl3auMR_2B2Gcxr4w7XyygsX84",
  authDomain: "progress-dietowy-1799e.firebaseapp.com",
  projectId: "progress-dietowy-1799e",
  storageBucket: "progress-dietowy-1799e.firebasestorage.app",
  messagingSenderId: "1045889496723",
  appId: "1:1045889496723:web:21c2cb855b4d716b1bff66"
};
const COLLECTION = "slowka";
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const LOCAL_KEY = "moj-angielski-v1";
const $ = id => document.getElementById(id);
let items = [];
let editingId = null;

function pref(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }
function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function byId(id){ return items.find(i => i.id === id); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; }catch(e){ return []; } }

/* ================= MAGAZYN: Firebase albo (awaryjnie) to urządzenie ================= */
const cloud = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
let db = null, col = null;

const store = {
  async add(it){ if(cloud) return setDoc(doc(col, it.id), clean(it)); items.unshift(it); saveLocal(); },
  async update(id, data){ if(cloud) return updateDoc(doc(col, id), data); Object.assign(byId(id), data); saveLocal(); },
  async remove(id){ if(cloud) return deleteDoc(doc(col, id)); items = items.filter(i => i.id !== id); saveLocal(); },
  async bulk(list){
    if(cloud){
      for(let i = 0; i < list.length; i += 400){
        const b = writeBatch(db);
        list.slice(i, i+400).forEach(it => b.set(doc(col, it.id), clean(it), {merge:true}));
        await b.commit();
      }
      return;
    }
    const ids = new Set(items.map(i => i.id));
    items = [...list.filter(i => !ids.has(i.id)), ...items]; saveLocal();
  }
};
function clean(it){
  return { en:it.en||"", pl:it.pl||"", pron:it.pron||"", exEn:it.exEn||"", exPl:it.exPl||"",
           known:!!it.known, added:it.added || new Date().toISOString() };
}
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); }catch(e){ toast("Nie udało się zapisać"); } dataChanged(); }
function fail(e){ console.error(e); toast(/permission/i.test(e && e.message) ? "Baza odmówiła dostępu (reguły Firestore)" : "Błąd zapisu w bazie"); }

function sortItems(){ items.sort((a,b) => (b.added||"").localeCompare(a.added||"") || a.id.localeCompare(b.id)); }

function dataChanged(){
  updateStats();
  if($("tab-list").classList.contains("on")) renderList();
  if($("tab-settings").classList.contains("on")) renderSettings();
}

function startStorage(){
  if(cloud){
    db = getFirestore(initializeApp(firebaseConfig));
    col = collection(db, COLLECTION);
    $("dbBadge").textContent = "☁️ łączę…";
    onSnapshot(col, snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      sortItems();
      $("dbBadge").textContent = "☁️ baza";
      dataChanged();
    }, err => { console.error(err); $("dbBadge").textContent = "⚠️ brak bazy"; toast("Nie mogę połączyć z bazą"); });
  } else {
    items = readLocal();
    $("dbBadge").textContent = "📱 lokalnie";
    dataChanged();
  }
}

function updateStats(){
  const k = items.filter(i => i.known).length;
  $("statsText").textContent = items.length ? `Znasz ${k} z ${items.length}` : "Brak słówek";
  $("statsBar").style.width = items.length ? (k/items.length*100)+"%" : "0";
}

/* ================= MOWA ================= */
function speak(text){
  if(!text || !("speechSynthesis" in window)) return toast("Brak tekstu do odsłuchania");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = 0.9;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang && v.lang.startsWith("en"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================= MENU ================= */
function showTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-"+name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  pref("tab", name);
  if(name === "list") renderList();
  if(name === "learn") startDeck();
  if(name === "settings") renderSettings();
  if(name === "add") idleStatus();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ================= GEMINI ================= */
const MODELS = ["gemini-flash-lite-latest", "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
const PROMPT = `Jesteś pomocnikiem do nauki angielskiego dla Polaka. Dostajesz wpis użytkownika: słowo, zwrot albo zdanie.
Wpis może mieć literówki i błędy gramatyczne albo być napisany po polsku.
Zwróć WYŁĄCZNIE obiekt JSON z polami:
- "en": poprawna, naturalna wersja po angielsku (popraw literówki i gramatykę; jeśli wpis jest po polsku – przetłumacz go na angielski). Pojedyncze słowa i zwroty małą literą, zdania wielką literą i z kropką.
- "fixed": true, jeśli coś poprawiłeś albo przetłumaczyłeś z polskiego; inaczej false.
- "note": jeśli fixed=true – bardzo krótko po polsku, co było źle (np. "literówka: recieve → receive"); inaczej "".
- "pl": naturalne tłumaczenie na polski. Dla pojedynczego słowa 1–3 najczęstsze znaczenia oddzielone przecinkami.
- "pron": brytyjska wymowa całego "en" zapisana polskimi literami, tak jak przeczytałby ją Polak, bez IPA i bez akcentów. Przykłady: "headache" → "hedejk", "I would like a coffee" → "aj łud lajk e kofi", "thought" → "fot", "the" → "de", "whisper" → "łysper".
- "exEn": jeśli wpis to słowo lub krótki zwrot – jedno proste, naturalne zdanie przykładowe z nim; jeśli wpis to całe zdanie – "".
- "exPl": tłumaczenie exEn na polski albo "".
Wpis: `;

async function gemini(text){
  const key = pref("geminiKey");
  if(!key) throw new Error("NOKEY");
  const order = [pref("geminiModel"), ...MODELS].filter((m,i,a) => m && a.indexOf(m) === i);
  let lastErr;
  for(const model of order){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: PROMPT + text }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0.2 }
      })
    });
    const d = await r.json().catch(() => ({}));
    const msg = (d.error && d.error.message) || ("HTTP " + r.status);
    if(!r.ok){
      // model niedostępny / bez darmowego limitu – próbuj następnego
      if((r.status === 404 || r.status === 429 || (r.status === 400 && /model/i.test(msg))) && !/api key/i.test(msg)){
        lastErr = new Error(msg); continue;
      }
      throw new Error(/api key/i.test(msg) ? "Nieprawidłowy klucz API" : msg);
    }
    const raw = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts
      ? d.candidates[0].content.parts.map(p => p.text || "").join("") : "";
    const json = JSON.parse(raw.replace(/^```(json)?|```$/g, "").trim());
    pref("geminiModel", model);
    return json;
  }
  throw lastErr || new Error("Brak modelu");
}

/* ================= DARMOWY ZAPAS (gdy brak klucza Gemini) ================= */
async function translateFree(text){
  try{
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|pl&q=" + encodeURIComponent(text));
    const d = await r.json();
    const t = d && d.responseData && d.responseData.translatedText;
    return (!t || /MYMEMORY WARNING|QUERY LENGTH/i.test(t)) ? "" : t;
  }catch(e){ return ""; }
}
const dictCache = new Map();
function dictLookup(word){
  word = word.toLowerCase();
  if(dictCache.has(word)) return dictCache.get(word);
  const p = fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word))
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if(!Array.isArray(d)) return null;
      let ipa = "", ex = "";
      for(const e of d){
        const ph = (e.phonetics || []).filter(p => p.text);
        const uk = ph.find(p => /-uk\.mp3/.test(p.audio || ""));
        ipa = ipa || (uk && uk.text) || e.phonetic || (ph[0] && ph[0].text) || "";
        for(const m of e.meanings || []) for(const df of m.definitions || []) if(!ex && df.example) ex = df.example;
      }
      return { ipa, ex };
    }).catch(() => null);
  dictCache.set(word, p);
  return p;
}
const IPA_MAP = [
  ["t͡ʃ","cz"],["tʃ","cz"],["d͡ʒ","dż"],["dʒ","dż"],
  ["eɪ","ej"],["aɪ","aj"],["ɔɪ","oj"],["aʊ","ał"],["əʊ","oł"],["oʊ","oł"],
  ["ɪə","i"],["ɪɚ","ir"],["eə","e"],["ɛə","e"],["ʊə","u"],
  ["ɜr","er"],["ɝ","er"],["ɚ","er"],["ɜ","er"],
  ["ʃ","sz"],["ʒ","ż"],["θ","f"],["ð","d"],["ŋ","ng"],
  ["ɪ","y"],["ᵻ","y"],["ɨ","y"],["ɛ","e"],["æ","a"],["ʌ","a"],["ɑ","a"],["ɐ","a"],["ɒ","o"],["ɔ","o"],["ʊ","u"],["ə","e"],
  ["ɹ","r"],["ɾ","t"],["ɫ","l"],["ɡ","g"],["ʔ",""],["w","ł"],["v","w"],["x","h"]
];
function ipaToPl(ipa){
  let s = ipa.split(",")[0].replace(/[\/\[\]ˈˌ.ːˑ()‿ʳ\s]/g, "");
  for(const [a,b] of IPA_MAP) s = s.split(a).join(b);
  return s.toLowerCase();
}
const SMALL = {"the":"de","a":"e","an":"en","i":"aj","you":"ju","he":"hi","she":"szi","it":"yt","we":"łi","they":"dej",
  "is":"yz","are":"ar","was":"łoz","were":"łer","be":"bi","to":"tu","of":"ow","and":"end","in":"yn","on":"on","at":"et",
  "for":"for","with":"łyf","my":"maj","your":"jor","his":"hyz","her":"her","this":"dys","that":"det","have":"hew",
  "has":"hez","had":"hed","do":"du","did":"dyd","not":"not","can":"ken","will":"łyl","would":"łud","me":"mi","from":"from",
  "i'm":"ajm","it's":"yts","don't":"dołnt","can't":"kant","i've":"ajw","you're":"jur","that's":"dets","let's":"lets"};
async function wordPron(w){
  const lw = w.toLowerCase().replace(/’/g,"'");
  if(SMALL[lw]) return SMALL[lw];
  const hit = await dictLookup(lw);
  if(hit && hit.ipa) return ipaToPl(hit.ipa);
  for(const [re, cut, suf] of [[/s$/,1,"s"],[/ed$/,2,"d"],[/ing$/,3,"ing"]]){
    if(re.test(lw)){ const h = await dictLookup(lw.slice(0,-cut)); if(h && h.ipa) return ipaToPl(h.ipa) + suf; }
  }
  return lw;
}
async function pronounceFree(text){
  const parts = text.match(/[A-Za-z'’-]+|[^A-Za-z'’-]+/g) || [];
  const out = await Promise.all(parts.map(p => /[A-Za-z]/.test(p) ? wordPron(p) : Promise.resolve(p.replace(/[.!?"“”]/g,""))));
  return out.join("").replace(/\s+/g," ").trim();
}
async function freeFill(text){
  const short = text.split(/\s+/).length <= 3;
  const [pl, pron, info] = await Promise.all([translateFree(text), pronounceFree(text), short ? dictLookup(text) : null]);
  const exEn = info && info.ex || "";
  const exPl = exEn ? await translateFree(exEn) : "";
  return { en:text, fixed:false, note:"", pl, pron, exEn, exPl };
}

/* ================= AUTOMATYCZNE UZUPEŁNIANIE ================= */
const FIELDS = ["pl","pron","exEn","exPl"];
let autoFilled = {}, autoSeq = 0, autoTimer = null, lastAutoText = "";

function fillable(f){ return !$(f).value.trim() || autoFilled[f]; }
function setAuto(f, val, force){ if(val && (force || fillable(f))){ $(f).value = val; autoFilled[f] = true; } }
FIELDS.forEach(f => $(f).addEventListener("input", () => { autoFilled[f] = false; }));

function idleStatus(){
  if($("en").value.trim()) return;
  $("autoStatus").innerHTML = pref("geminiKey")
    ? "🤖 Wpisz coś — Gemini przetłumaczy, poprawi błędy i doda wymowę."
    : `Reszta uzupełni się sama (wersja podstawowa). <button class="link" id="goSet">Dodaj klucz Gemini</button>, żeby było trafniej.`;
  if($("goSet")) $("goSet").onclick = () => showTab("settings");
}

async function autoFill(force){
  const text = $("en").value.trim();
  if(!text){ $("fixBox").innerHTML = ""; idleStatus(); return; }
  if(!force && text === lastAutoText) return;
  if(!force && !FIELDS.some(fillable)) return;
  const seq = ++autoSeq;
  lastAutoText = text;
  const useGemini = !!pref("geminiKey");
  $("autoStatus").textContent = useGemini ? "🤖 Gemini myśli…" : "⏳ Tłumaczę…";
  let r, via = "gemini";
  try{
    r = useGemini ? await gemini(text) : await freeFill(text);
    if(!useGemini) via = "free";
  }catch(e){
    console.warn(e);
    if(seq !== autoSeq) return;
    $("autoStatus").textContent = "⚠️ Gemini nie odpowiada (" + e.message.slice(0,60) + ") — używam wersji podstawowej…";
    r = await freeFill(text); via = "free";
  }
  if(seq !== autoSeq) return;

  // korekta błędów
  $("fixBox").innerHTML = "";
  if(r.en && r.fixed && r.en.trim() !== text){
    const original = text;
    $("en").value = r.en.trim();
    lastAutoText = r.en.trim();
    $("fixBox").innerHTML = `<div class="fix">✏️ Poprawiłem na: <b>${esc(r.en)}</b>${r.note ? "<br>" + esc(r.note) : ""}
      &nbsp;<button class="link" id="undoFix">Cofnij</button></div>`;
    $("undoFix").onclick = () => { $("en").value = original; lastAutoText = original; $("fixBox").innerHTML = ""; };
  }
  setAuto("pl", r.pl, force);
  setAuto("pron", r.pron, force);
  setAuto("exEn", r.exEn, force);
  setAuto("exPl", r.exPl, force);
  $("autoStatus").textContent = via === "gemini"
    ? "✓ Gotowe — sprawdź i zapisz."
    : (r.pl ? "✓ Uzupełnione (wersja podstawowa) — sprawdź i zapisz." : "Nie udało się przetłumaczyć — wpisz ręcznie.");
}

$("en").addEventListener("input", () => {
  autoSeq++;                       // anuluj trwające uzupełnianie
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => autoFill(false), 900);
});
$("en").addEventListener("blur", () => { clearTimeout(autoTimer); autoFill(false); });
$("refill").onclick = () => { clearTimeout(autoTimer); autoFill(true); };

/* ================= DODAJ / EDYTUJ ================= */
function clearForm(){
  ["en", ...FIELDS].forEach(f => $(f).value = "");
  autoFilled = {}; autoSeq++; lastAutoText = "";
  editingId = null; $("save").textContent = "Zapisz"; $("cancel").style.display = "none";
  $("fixBox").innerHTML = ""; idleStatus();
}
$("save").onclick = async () => {
  const v = f => $(f).value.trim();
  const en = v("en");
  if(!en){ toast("Wpisz coś po angielsku"); $("en").focus(); return; }
  const data = { en, pl:v("pl"), pron:v("pron"), exEn:v("exEn"), exPl:v("exPl") };
  $("save").disabled = true;
  try{
    if(editingId){
      await store.update(editingId, data);
      clearForm(); toast("Zmieniono"); showTab("list");
    } else {
      if(items.some(i => i.en.toLowerCase() === en.toLowerCase()) && !confirm("To już jest na liście. Dodać jeszcze raz?")) return;
      const it = { id:newId(), ...data, known:false, added:new Date().toISOString() };
      const p = store.add(it);
      clearForm(); toast("Zapisano"); $("en").focus();
      await p;
    }
  }catch(e){ fail(e); }
  finally{ $("save").disabled = false; }
};
$("cancel").onclick = () => { clearForm(); showTab("list"); };
$("speakInput").onclick = () => speak($("en").value.trim());
$("exPl").addEventListener("keydown", e => { if(e.key === "Enter") $("save").click(); });

/* ================= LISTA ================= */
let listFilter = "all";
$("listFilter").onclick = e => {
  const b = e.target.closest(".chip"); if(!b) return;
  listFilter = b.dataset.f;
  $("listFilter").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  renderList();
};
$("search").oninput = renderList;

function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const shown = items.filter(i =>
    (listFilter === "all" || (listFilter === "known") === !!i.known) &&
    (!q || [i.en,i.pl,i.pron,i.exEn,i.exPl].some(f => (f||"").toLowerCase().includes(q))));
  $("count").textContent = items.length ? `${shown.length} pozycji` : "";
  if(!items.length){ $("list").innerHTML = '<div class="empty">Nic jeszcze nie ma — dodaj słówko w zakładce „Dodaj” albo wczytaj plik w „Ustawieniach”</div>'; return; }
  if(!shown.length){ $("list").innerHTML = '<div class="empty">Brak wyników</div>'; return; }
  $("list").innerHTML = shown.map(i => `
    <div class="item ${i.known ? "known" : ""}">
      <div class="en">${esc(i.en)}</div>
      ${i.pl ? `<div class="pl">${esc(i.pl)}</div>` : ""}
      ${i.pron ? `<div class="pron">${esc(i.pron)}</div>` : ""}
      ${i.exEn ? `<div class="ex"><div>${esc(i.exEn)}</div>${i.exPl ? `<div class="exPl">${esc(i.exPl)}</div>` : ""}</div>` : ""}
      <div class="actions">
        <button class="small knownBtn ${i.known ? "on" : ""}" data-known="${i.id}">${i.known ? "✓ Znam" : "Znam?"}</button>
        <button class="small" data-speak="${i.id}">🔊</button>
        ${i.exEn ? `<button class="small" data-speakex="${i.id}">🔊 Zdanie</button>` : ""}
        <button class="small ghost" data-edit="${i.id}">Edytuj</button>
        <button class="small danger" data-del="${i.id}">Usuń</button>
      </div>
    </div>`).join("");
}

$("list").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.known){ const it = byId(d.known); store.update(it.id, { known: !it.known }).catch(fail); }
  if(d.speak) speak(byId(d.speak).en);
  if(d.speakex) speak(byId(d.speakex).exEn);
  if(d.edit){
    const it = byId(d.edit);
    $("en").value = it.en; FIELDS.forEach(f => $(f).value = it[f] || "");
    autoFilled = {}; editingId = it.id; lastAutoText = it.en; $("fixBox").innerHTML = "";
    $("save").textContent = "Zapisz zmiany"; $("cancel").style.display = "block";
    showTab("add");
    $("autoStatus").textContent = "Edytujesz wpis. 🔄 uzupełni wszystko od nowa.";
  }
  if(d.del){
    const it = byId(d.del);
    if(confirm(`Usunąć „${it.en}”?`)) store.remove(it.id).catch(fail);
  }
};

/* ================= NAUKA ================= */
let learnMode = "todo";
let dir = pref("dir") || "en";
let deck = [], pos = 0, revealed = false, round = {yes:0, no:0};

$("dirBtn").textContent = dir === "en" ? "EN → PL" : "PL → EN";
$("dirBtn").onclick = () => {
  dir = dir === "en" ? "pl" : "en"; pref("dir", dir);
  $("dirBtn").textContent = dir === "en" ? "EN → PL" : "PL → EN";
  revealed = false; renderCard();
};
$("learnMode").onclick = e => {
  const b = e.target.closest(".chip[data-m]"); if(!b) return;
  learnMode = b.dataset.m;
  $("learnMode").querySelectorAll(".chip[data-m]").forEach(c => c.classList.toggle("on", c === b));
  startDeck();
};
function startDeck(){
  deck = items.filter(i => learnMode === "all" || !i.known).map(i => i.id);
  for(let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  pos = 0; revealed = false; round = {yes:0, no:0};
  renderCard();
}
function renderCard(){
  const box = $("learn");
  if(!items.length){ box.innerHTML = '<div class="empty">Najpierw dodaj jakieś słówka 🙂</div>'; return; }
  if(!deck.length){
    box.innerHTML = `<div class="card empty">🎉 Znasz wszystkie słówka!<br><br><button class="primary" id="allBtn">Powtórz wszystkie</button></div>`;
    $("allBtn").onclick = () => $("learnMode").querySelector('[data-m="all"]').click();
    return;
  }
  if(pos >= deck.length){
    box.innerHTML = `<div class="card empty">
      <div style="font-size:1.3rem;font-weight:700;color:var(--text)">Koniec rundy</div>
      <p>✅ Znam: <b>${round.yes}</b> &nbsp; ❌ Do powtórki: <b>${round.no}</b></p>
      <button class="primary" id="againBtn">Jeszcze raz</button></div>`;
    $("againBtn").onclick = startDeck;
    return;
  }
  const it = byId(deck[pos]);
  if(!it){ pos++; return renderCard(); }
  const front = dir === "en" ? it.en : (it.pl || it.en);
  const back  = dir === "en" ? (it.pl || "—") : it.en;
  box.innerHTML = `
    <div class="progress"><span>${pos+1} / ${deck.length}</span><span>✅ ${round.yes} · ❌ ${round.no}</span></div>
    <div class="card flash" id="flash">
      <div class="front">${esc(front)}</div>
      ${revealed ? `
        <div class="answer">
          <div class="big">${esc(back)}</div>
          ${it.pron ? `<div class="pron">${esc(it.pron)}</div>` : ""}
          ${it.exEn ? `<div class="ex"><div>${esc(it.exEn)}</div>${it.exPl ? `<div class="exPl">${esc(it.exPl)}</div>` : ""}</div>` : ""}
        </div>` : `<div class="hint">Stuknij, żeby zobaczyć odpowiedź</div>`}
    </div>
    <div class="row" style="justify-content:center;margin-bottom:12px">
      <button class="small" id="cardSpeak">🔊 Odsłuchaj</button>
      ${it.exEn && revealed ? `<button class="small" id="cardSpeakEx">🔊 Zdanie</button>` : ""}
    </div>
    ${revealed
      ? `<div class="answerBtns"><button class="no" id="noBtn">❌ Nie znam</button><button class="yes" id="yesBtn">✅ Znam</button></div>`
      : `<button class="primary wide" id="showBtn" style="margin-top:0">Pokaż odpowiedź</button>`}`;
  const reveal = () => { if(!revealed){ revealed = true; renderCard(); if(dir === "pl") speak(it.en); } };
  $("flash").onclick = reveal;
  if($("showBtn")) $("showBtn").onclick = reveal;
  $("cardSpeak").onclick = () => speak(it.en);
  if($("cardSpeakEx")) $("cardSpeakEx").onclick = () => speak(it.exEn);
  if(revealed){
    $("yesBtn").onclick = () => answer(it, true);
    $("noBtn").onclick  = () => answer(it, false);
  }
}
function answer(it, known){
  if(!!it.known !== known) store.update(it.id, { known }).catch(fail);
  known ? round.yes++ : round.no++;
  pos++; revealed = false; renderCard();
}

/* ================= USTAWIENIA ================= */
$("gKey").value = pref("geminiKey") || "";
$("gSave").onclick = async () => {
  const k = $("gKey").value.trim();
  pref("geminiKey", k || null); pref("geminiModel", null);
  if(!k){ $("gStatus").textContent = "Klucz usunięty — działa wersja podstawowa."; return; }
  $("gStatus").textContent = "⏳ Sprawdzam klucz…";
  try{
    const r = await gemini("recieve");
    $("gStatus").innerHTML = `<span class="ok">✓ Działa!</span> Test: „recieve” → <b>${esc(r.en)}</b> [${esc(r.pron)}] – ${esc(r.pl)}`;
  }catch(e){
    $("gStatus").innerHTML = `<span class="bad">✗ Nie działa:</span> ${esc(e.message.slice(0,140))}`;
  }
};

function renderSettings(){
  if(cloud){
    $("dbInfo").innerHTML = `Połączono z Firebase (<b>${esc(firebaseConfig.projectId)}</b>, kolekcja „${COLLECTION}”). Słówka są te same na każdym urządzeniu.`;
    const local = readLocal();
    $("migrateBox").innerHTML = local.length
      ? `<button class="primary wide" id="migrate">Przenieś ${local.length} słówek z tego urządzenia do bazy</button>` : "";
    if($("migrate")) $("migrate").onclick = async () => {
      $("migrate").disabled = true; $("migrate").textContent = "Przenoszę…";
      try{ await store.bulk(local); localStorage.removeItem(LOCAL_KEY); toast(`Przeniesiono ${local.length}`); renderSettings(); }
      catch(e){ fail(e); $("migrate").disabled = false; $("migrate").textContent = "Spróbuj ponownie"; }
    };
  } else {
    $("dbInfo").innerHTML = `Baza nie jest jeszcze podłączona — słówka zapisują się tylko na tym urządzeniu. Wklej <b>firebaseConfig</b> na górze pliku index.html.`;
    $("migrateBox").innerHTML = "";
  }
}

$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `moj-angielski-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!Array.isArray(data)) throw 0;
    const ids = new Set(items.map(i => i.id));
    const fresh = data.filter(i => i && i.en && i.id && !ids.has(i.id));
    toast("Wczytuję…");
    await store.bulk(fresh);
    toast(`Wczytano ${fresh.length}`);
  }catch(err){ (!err || err instanceof SyntaxError) ? toast("Nieprawidłowy plik") : fail(err); }
  e.target.value = "";
};

/* ================= START ================= */
if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
startStorage();
showTab(pref("tab") || "list");
</script>
